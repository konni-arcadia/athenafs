# Scans the whole history and every commit message for secrets on each push. The rules come from the repository
# secret SCAN_CONFIG (a gitleaks configuration) when it is set, else gitleaks' default rules. Matches are redacted
# from the logs. Detection only: the push has happened by then.
name: secret scan
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (checksum checked)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Rules
        env:
          SCAN_CONFIG: ${{ secrets.SCAN_CONFIG }}
        run: |
          if [ -n "$SCAN_CONFIG" ]; then printf '%s\n' "$SCAN_CONFIG" > "$RUNNER_TEMP/rules.toml"
          else printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/rules.toml"; fi
      - name: History
        run: '"$RUNNER_TEMP/gitleaks" git . -c "$RUNNER_TEMP/rules.toml" --redact --no-banner -v'
      - name: Commit messages
        run: git log --format=%B | "$RUNNER_TEMP/gitleaks" stdin -c "$RUNNER_TEMP/rules.toml" --redact --no-banner -v
