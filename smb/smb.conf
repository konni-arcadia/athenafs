# Read-only share of the mounted torrents (test). Local network only. Account: tor / rent (see entrypoint.sh).
[global]
   workgroup = WORKGROUP
   server string = torrents
   server role = standalone server
   map to guest = Never
   server min protocol = SMB2
   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log level = 1
   # macOS (Finder): Apple metadata handled by vfs_fruit, never written (read-only share)
   vfs objects = fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:nfs_aces = no
   fruit:posix_rename = yes
   fruit:veto_appledouble = yes
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

[torrents] # the share
   path = /srv/m/fs
   read only = yes
   guest ok = no
   browseable = yes
   # what Finder and Explorer write or read for their previews and indexes: invisible, so never read
   # veto files: written by entrypoint.sh (preview and index files, plus the folders hidden from the page)
   include = /etc/samba/athenafs-veto.conf
   delete veto files = no
   oplocks = no
   level2 oplocks = no
   kernel oplocks = no
   strict locking = no
   follow symlinks = no
   wide links = no
   access based share enum = no
