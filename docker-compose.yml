# athenafs: torrents as a read-only network folder.
#   core = patched Distribyted (FUSE filesystem, downloads on demand) + a supervisor with a web page
#   smb  = Samba, sharing the FUSE mount read-only
# Start with scripts/up.sh (it prepares the host mount point); see README.md.
name: athenafs
services:
  core:
    build: ./core
    container_name: athenafs-core
    restart: "no"
    stop_grace_period: 60s   # Distribyted needs more than Docker's default 10 s to stop with hundreds of torrents; killed
                             # before, it leaves a dead FUSE mount behind (Transport endpoint is not connected)
    devices: ["/dev/fuse:/dev/fuse"]
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN, DAC_OVERRIDE]
    security_opt: ["apparmor:unconfined", "no-new-privileges:true"]
    environment:
      DISTRIBYTED_CONFIG: /config/config.yaml
      DISTRIBYTED_METAINFO_DIR: /data/metainfo
      DISTRIBYTED_DORMANT_AFTER: "${ATHENAFS_DORMANT_AFTER:-600}"   # s without an open file before a torrent sleeps; 0 = never
      DISTRIBYTED_HEALTH_PROBE: "${ATHENAFS_HEALTH_PROBE:-60}"      # s a dormant torrent is woken for its health check; 0 = off
      DISTRIBYTED_HEALTH_PARALLEL: "${ATHENAFS_HEALTH_PARALLEL:-2}" # health checks at a time
      DISTRIBYTED_HEALTH_ORDER: /data/health-order.txt
      DISTRIBYTED_ROOT_FILES: /data/share-root      # files shown at the root of the share (links to the page)
      DISTRIBYTED_ARCHIVE_VIEWS: /data/archive-views.json   # written by admin.py: complete archives per archive view
      ATHENAFS_COMMIT: "${ATHENAFS_COMMIT:-unknown}"   # set by scripts/up.sh, checked by scripts/measure.sh
      ATHENAFS_WARNINGS: "${ATHENAFS_WARNINGS:-}"   # set by scripts/up.sh: risky exposures, shown on the page
      ATHENAFS_PASSWORD: "${ATHENAFS_PASSWORD:-}"   # page and API password (user "admin"); empty = none
      ATHENAFS_SMB_HOST: "${ATHENAFS_SMB_HOST:-}"   # host name in the smb:// and \\host\share locations of the API
      ATHENAFS_SMB_SHARE: "${SMB_SHARE:-torrents}"
      ATHENAFS_ADD_TIMEOUT: "${ATHENAFS_ADD_TIMEOUT:-}"   # overrides add_timeout of core/config.yaml when set
      ATHENAFS_READ_TIMEOUT: "${ATHENAFS_READ_TIMEOUT:-}" # overrides read_timeout of core/config.yaml when set
      ATHENAFS_PAGE_URL: "${ATHENAFS_PAGE_URL:-}"   # address of this page as seen from the network (set by scripts/up.sh)
      DISTRIBYTED_ARCHIVES: "${ATHENAFS_ARCHIVES:-off}"   # "on": zip/7z/rar open as folders (expensive to browse)
    ports: ["${ATHENAFS_BIND:-127.0.0.1}:${ATHENAFS_PORT:-8080}:8080"]
    volumes:
      - ./core/config.yaml:/config/config.yaml:ro
      - ${DATA:-./data}/torrents:/torrents:ro      # optional .torrent files provided by hand (read-only)
      - ${DATA:-./data}/state:/data                # cache, sources.json, settings, saved metadata, logs
      - type: bind
        source: ${DATA:-./data}/mount              # the FUSE mount appears in mount/fs/<folder>/ on the host
        target: /mnt/torrents
        bind:
          propagation: rshared
  smb:
    build: ./smb
    container_name: athenafs-smb
    restart: "no"
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]   # smbpasswd/useradd, then smbd switching to the account (measured: nothing else)
    security_opt: ["no-new-privileges:true"]
    depends_on: [core]
    ports: ["${SMB_BIND:-127.0.0.1}:${SMB_PORT:-445}:445"]
    environment:
      SMB_SHARE: "${SMB_SHARE:-torrents}"
      SMB_USER: "${SMB_USER:-tor}"
      SMB_PASS: "${SMB_PASS:-rent}"
    volumes:
      # rslave: sees the FUSE mounts (re)made by the core container, without being able to propagate anything back
      - type: bind
        source: ${DATA:-./data}/mount
        target: /srv/m
        read_only: true
        bind:
          propagation: rslave
